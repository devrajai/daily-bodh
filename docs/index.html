  .sub{font-size:12px;opacity:.72;margin-top:1px}
  nav{max-width:1000px;margin:10px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

<script>
/* ---------------------------------------------------------------- helpers */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
/* Fetch a bundled JSON file. A failure is never cached, so a retry really
   retries, and a non-200 answer is reported instead of being parsed as data. */
const cache = {};
function data(name){
  if(!cache[name]){
    cache[name] = (async () => {
      const r = await fetch('data/' + name, {cache: 'no-cache'});
      if(!r.ok) throw new Error('could not load ' + name + ' (HTTP ' + r.status + ')');
      try { return await r.json(); }
      catch(e){ throw new Error(name + ' is not valid JSON'); }
    })();
    cache[name].catch(() => { delete cache[name]; });
  }
  return cache[name];
}
const NAK = ["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya",
"Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha",
"Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha",
"Purva Bhadrapada","Uttara Bhadrapada","Revati"];
const RASHI = ["Aries (Mesh)","Taurus (Vrishabh)","Gemini (Mithun)","Cancer (Kark)","Leo (Simha)",
"Virgo (Kanya)","Libra (Tula)","Scorpio (Vrishchik)","Sagittarius (Dhanu)","Capricorn (Makar)",
"Aquarius (Kumbh)","Pisces (Meen)"];
const iso = d => d.toISOString().slice(0,10);
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4); };

/* ------------------------------------------------------------- birth star */
let MOON = null;
async function moon(){
  if(MOON) return MOON;
  const m = await data('moonstars.json');
  const b64 = s => { const bin=atob(s); const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
  MOON = { from:new Date(m.from+'T00:00:00Z'), stars:b64(m.stars), lon:b64(m.moonLon) };
  return MOON;
}
async function birthStar(dateStr){
  const m = await moon();
  const d = new Date(dateStr+'T00:00:00Z');
  const i = Math.round((d-m.from)/864e5);
  if(i<0 || i>=m.stars.length) return null;
  const lon = (m.lon[2*i] | (m.lon[2*i+1]<<8))/100;
  const span = 360/27;
  return { nak:m.stars[i], lon, rashi:Math.floor(lon/30)%12,
           pada:Math.floor((lon%span)/(span/4))+1 };
}

/* ------------------------------------------------------------- numerology */
const CHAL = {a:1,i:1,j:1,q:1,y:1,b:2,k:2,r:2,c:3,g:3,l:3,s:3,d:4,m:4,t:4,e:5,h:5,n:5,
  x:5,u:6,v:6,w:6,o:7,z:7,f:8,p:8};
const reduce = v => { let x=Math.abs(v); while(x>9){ let s=0; while(x>0){s+=x%10;x=Math.floor(x/10);} x=s; } return x; };
const nameNumber = n => reduce([...n.toLowerCase()].reduce((a,c)=>a+(CHAL[c]||0),0));

/* ------------------------------------------------------------ guna milan */
/* Ashtakoota, the classical 36-point system. Every table and every partial
   score below is taken from the reference implementation (kalagana, MIT) so
   the numbers can be checked against it - see tests/gunamilan.test.js, which
   pins 20 pairs and fails if any koota drifts. The full 729-pair sweep was
   verified identical before this was shipped. */
const varnaByRashi=[2,1,0,3,2,1,0,3,2,1,0,3];
const ganaByNak=[0,1,2,1,0,1,0,0,2,2,1,1,0,2,0,2,0,2,2,1,1,0,2,2,1,1,0];
const nadiByNak=[0,1,2,2,1,0,0,1,2,2,1,0,0,1,2,2,1,0,0,1,2,2,1,0,0,1,2];
const yoniByNak=[0,1,2,3,3,4,5,2,5,6,6,7,8,9,8,9,10,10,4,11,12,11,13,0,13,7,1];
const yoniNames=["Horse","Elephant","Goat","Serpent","Dog","Cat","Rat","Cow","Buffalo","Tiger","Deer","Monkey","Mongoose","Lion"];
const yoniEnemies=[[0,8],[1,13],[2,11],[3,12],[4,10],[5,6],[7,9]];
const lordByRashi=[2,5,3,1,0,3,5,2,4,6,6,4];
const FRIENDS=[[1,2,4],[0,3],[0,1,4],[0,5],[0,1,2],[3,6],[3,5]];
const ENEMIES=[[5,6],[],[3],[1],[3,5],[0,1],[0,1,2]];
/* Vashya groups: 0 Chatushpada, 1 Manava, 2 Jalachara, 3 Keeta */
const VASHYA_BY_RASHI=[0,0,1,2,0,1,1,3,0,0,1,2];
const VASHYA_NAMES=['Chatushpada','Manava','Jalachara','Keeta'];
const GANA_NAMES=['Deva','Manushya','Rakshasa'];
const varnaName=v=>["Shudra","Vaishya","Kshatriya","Brahmin"][v];
const ganaName=g=>GANA_NAMES[g];
const lordName=l=>["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn"][l];
const inSet=(a,b)=>a.includes(b);
const pairIn=(set,a,b)=>set.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
function taraScore(from,to){ const count=((to-from)%27+27)%27; const r=count%9; return (r===0||r===2||r===4||r===6) ? 0 : 1.5; }
function vashyaPoints(aR,bR){
  const ga=VASHYA_BY_RASHI[aR], gb=VASHYA_BY_RASHI[bR];
  if(ga===gb) return [2.0, VASHYA_NAMES[ga]];
  if(ga===3||gb===3) return [0.0, "one is Keeta (insect)"];
  return [1.0, "different groups"];
}
function ganaPoints(bN,gN){
  const ga=GANA_NAMES[ganaByNak[bN]], gb=GANA_NAMES[ganaByNak[gN]];
  if(ga===gb) return [6.0, ga];
  const p=[ga,gb].slice().sort().join('/');
  if(p==='Deva/Manushya') return [5.0, ga+'/'+gb];
  if(p==='Deva/Rakshasa') return [1.0, ga+'/'+gb];
  return [0.0, ga+'/'+gb];
}
function grahaMaitriPoints(aR,bR){
  const la=lordByRashi[aR], lb=lordByRashi[bR];
  if(la===lb) return [5.0, "same lord ("+lordName(la)+")"];
  const rel=(a,b)=> inSet(FRIENDS[a],b) ? 'friend' : (inSet(ENEMIES[a],b) ? 'enemy' : 'neutral');
  const ra=rel(la,lb), rb=rel(lb,la);
  const pair=[ra,rb].slice().sort().join('/');
  const d=lordName(la)+'/'+lordName(lb);
  if(pair==='friend/friend')   return [5.0, d+" mutual friends"];
  if(pair==='neutral/neutral') return [3.0, d+" neutral"];
  if(pair==='friend/neutral')  return [4.0, d+" friend/neutral"];
  if(pair==='enemy/friend')    return [1.0, d+" friend/enemy"];
  if(pair==='enemy/neutral')   return [0.5, d+" neutral/enemy"];
  return [0.0, d+" mutual enemies"];
}
function bhakootPoints(aR,bR){
  const diff=((aR-bR)%12+12)%12+1;
  if([2,12,5,9,6,8].includes(diff)) return [0.0, "inauspicious distance ("+diff+")"];
  return [7.0, "distance "+diff];
}
function gunaMilan(bN,bR,gN,gR){
  const k=[];
  const vb=varnaByRashi[bR], vg=varnaByRashi[gR];
  k.push(["Varna",1,vb>=vg?1:0,`boy ${varnaName(vb)} / girl ${varnaName(vg)}`]);
  const vs=vashyaPoints(bR,gR);
  k.push(["Vashya",2,vs[0],vs[1]+" (simplified tiers)"]);
  k.push(["Tara",3,taraScore(gN,bN)+taraScore(bN,gN),"both directions"]);
  const yb=yoniByNak[bN], yg=yoniByNak[gN];
  const yen=pairIn(yoniEnemies,yb,yg);
  k.push(["Yoni",4,yb===yg?4:(yen?0:2),
    (yb===yg?`same yoni (${yoniNames[yb]})`:(yen?`sworn enemies (${yoniNames[yb]}/${yoniNames[yg]})`:`${yoniNames[yb]}/${yoniNames[yg]}`))+" (simplified tiers)"]);
  const gm=grahaMaitriPoints(bR,gR);
  k.push(["Graha Maitri",5,gm[0],gm[1]]);
  const gn=ganaPoints(bN,gN);
  k.push(["Gana",6,gn[0],gn[1]]);
  const bk=bhakootPoints(bR,gR);
  k.push(["Bhakoot",7,bk[0],bk[1]]);
  const same=nadiByNak[bN]===nadiByNak[gN];
  k.push(["Nadi",8,same?0:8,same?"same nadi - Nadi dosha":"different nadi"]);
  const total=k.reduce((a,x)=>a+x[2],0);
  const verdict = total>=32?"Traditionally considered excellent"
    : total>=25?"Traditionally considered good"
    : total>=18?"Traditionally considered acceptable"
    : "Traditionally considered weak; read the per-koota breakdown closely";
  return {kootas:k,total,verdict};
}

/* --------------------------------------------------------------- muhurat */
const taraBala=(j,n)=>(((n-j+27)%27)%9)+1;
const chandraBala=(jr,mr)=>((mr-jr+12)%12)+1;
function muhuratDay(M,fn,day,lon,persons){
  const reasons=[], blockers=[];
  if(fn.varas.includes(day.vara)) reasons.push(`Weekday ${day.vara} is favourable`);
  else blockers.push(`Weekday ${day.vara} is not one of the favourable days`);
  const within = day.tithiNum>0 ? ((day.tithiNum-1)%15)+1 : 0;
  if(!within) blockers.push("Tithi could not be read");
  else if(fn.tithis.includes(within)) reasons.push(`Tithi ${day.tithi} is favourable`);
  else blockers.push(`Tithi ${day.tithi} is not favourable for this`);
  if(fn.nakshatras.includes(day.nakNum)) reasons.push(`Nakshatra ${day.nakshatra} is favourable`);
  else if(day.nakNum>=0) blockers.push(`Nakshatra ${day.nakshatra} is not favourable for this`);
  if(fn.avoidKaranas.some(x=>x.toLowerCase()===day.karana.toLowerCase()))
    blockers.push(`Karana ${day.karana} (Bhadra/Vishti) is avoided`);
  if(fn.avoidYogas.some(x=>x.toLowerCase()===day.yoga.toLowerCase()))
    blockers.push(`Yoga ${day.yoga} is an inauspicious yoga`);
  const mr = lon!=null ? Math.floor(lon/30)%12 : null;
  persons.forEach(p=>{
    if(day.nakNum>=0){
      const t=taraBala(p.nak,day.nakNum), nm=M.taras[t-1]||("Tara "+t);
      if(M.goodTaras.includes(t)) reasons.push(`${p.label}: ${nm} tara is favourable`);
      else blockers.push(`${p.label}: ${nm} tara is not favourable`);
    }
    if(mr!=null){
      const h=chandraBala(p.rashi,mr);
      if(M.goodMoonHouses.includes(h)) reasons.push(`${p.label}: Moon in house ${h} is favourable`);
      else blockers.push(`${p.label}: Moon in house ${h} is not favourable`);
    }
  });
  return {day:day.d,vara:day.vara,tithi:day.tithi,nakshatra:day.nakshatra,
          auspicious:blockers.length===0,reasons,blockers};
}

/* -------------------------------------------------------------- panchang */
function pRow(k,v){ return v ? `<tr><td class="k">${k}</td><td>${v}</td></tr>` : ''; }
async function renderPanchang(){
  const P = await data('panchang.json');
  const F = await data('festivals.json');
  const s = $('#panchang');
  const day = s.dataset.date || iso(today());
  const d = P.days.find(x=>x.d===day);
  const upcoming = F.festivals.filter(x=>x.d>=iso(today())).slice(0,14);
  s.innerHTML = `
    <h2>Panchang</h2>
    <p class="lead">${P.location} · times in ${P.timezone||'local time'} · computed from positional astronomy</p>
    <div class="card">
      <label>Date</label>
      <input type="date" id="pd" value="${day}">
      ${ d ? `
        <h3 style="margin-top:14px">${d.vara} · ${d.paksha} ${d.tithi}</h3>
        <table>
          ${pRow('Tithi', `${d.tithi} <span class="muted">till ${d.tithiEnd}</span>`)}
          ${pRow('Nakshatra', `${d.nakshatra} <span class="muted">till ${d.nakEnd}</span>`)}
          ${pRow('Yoga', d.yoga)}
          ${pRow('Karana', d.karana + (/vishti|bhadra/i.test(d.karana) ? ' <span class="no">(avoid for new starts)</span>' : ''))}
          ${pRow('Masa', d.masa)}
          ${pRow('Sunrise', d.sunrise)}
          ${pRow('Sunset', d.sunset)}
        </table>
      ` : `<p class="muted" style="margin-top:12px">No panchang bundled for that date. The range is ${P.from} to ${P.to}.</p>` }
    </div>
    ${ d ? `<div class="card">
      <h3>Timings</h3>
      <table>
        ${pRow('Brahma muhurta', d.brahma)}
        ${pRow('Abhijit', d.abhijit)}
        ${pRow('Rahu kalam', d.rahu)}
        ${pRow('Yamaganda', d.yamaganda)}
        ${pRow('Gulika', d.gulika)}
      </table>
      <p class="muted" style="margin-top:10px">Rahu kalam, Yamaganda and Gulika are the windows traditionally avoided for new starts.</p>
    </div>` : '' }
    <div class="card">
      <h3>Festivals ahead</h3>
      ${upcoming.map(f=>`<div style="padding:5px 0"><span class="pill">${f.d}</span> ${f.n}${f.k?` <span class="muted">· ${f.k}</span>`:''}</div>`).join('')}
    </div>

/* ------------------------------------------------------------- horoscope */
async function renderHoroscope(){
  const infoData = await data('rashifal-info.json');
  const s = $('#horoscope');
  if(s.dataset.rashi==null) s.dataset.rashi='0';
  if(!s.dataset.period) s.dataset.period='daily';
  const r = +s.dataset.rashi, per = s.dataset.period, t = today();
  const key = per==='daily' ? iso(t) : (per==='monthly' ? iso(t).slice(0,7) : String(t.getFullYear()));

  let R = null;
  try {
    if(per === 'daily') {
      const year = key.slice(0,4);
      R = await data('rashifal-daily-' + year + '.json');
    } else if (per === 'monthly') {
      R = await data('rashifal-monthly.json');
    } else {
      R = await data('rashifal-yearly.json');
    }
  } catch(e) {
    // A missing year file just means that year is not bundled, so fall through
    // to the "no reading bundled" note below. Anything else is a real failure,
    // and is re-thrown so the tab shows an error with a retry rather than
    // pretending there is simply no data for that period.
    if(!/HTTP 404/.test((e && e.message) || '')) throw e;
    R = {};
  }

  const bag = per==='daily' ? (R.daily||{}) : (per==='monthly' ? (R.monthly||{}) : (R.yearly||{}));
  const entry = (bag[key]||[])[r];
  const info = infoData.rashis[r]||{};
  s.innerHTML = `
    <h2>Horoscope</h2>
    <p class="lead">The real planetary transits and the classical gochar reading for each Moon sign — computed, not written by hand.</p>
    <div class="chips">${infoData.rashis.map((x,i)=>`<button class="chip" data-r="${i}" aria-pressed="${i===r}">${x.key}</button>`).join('')}</div>
    <div class="chips">
      ${['daily','monthly','yearly'].map(p=>`<button class="chip" data-p="${p}" aria-pressed="${p===per}">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}
    </div>
    <div class="card">
      <h3>${info.key||''} · ${info.en||''}</h3>
      ${ entry ? `
        ${entry.h?`<p style="font-size:17px">${entry.h}</p>`:''}
        <p class="muted">Score ${entry.s} of 5${entry.b?` · ${entry.b}`:''}</p>
        ${entry.f.length?`<p><strong>Favourable</strong><br>${entry.f.join(', ')}</p>`:''}
        ${entry.c.length?`<p><strong>Needs care</strong><br>${entry.c.join(', ')}</p>`:''}
      ` : `<p class="muted">No reading bundled for ${key}. Daily covers ${infoData.dailyFrom} to ${infoData.dailyTo}; monthly and yearly cover ${infoData.monthlyFrom} to ${infoData.monthlyTo}.</p>` }
    </div>
    <div class="warn">${infoData.disclaimer||''}</div>
  `;
  s.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ s.dataset.rashi=b.dataset.r; renderHoroscope(); });
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ s.dataset.period=b.dataset.p; renderHoroscope(); });
}

/* --------------------------------------------------------------- muhurat */
async function renderMuhurat(){
  const M = await data('muhurat.json');
  const s = $('#muhurat');
  if(s.dataset.fn==null) s.dataset.fn='0';
  const i = +s.dataset.fn;
  s.innerHTML = `
    <h2>Muhurat</h2>
    <p class="lead">Auspicious days for a function, from the classical rules — weekday, tithi, nakshatra, and the avoided karana and yoga.</p>
    <div class="chips">${M.functions.map((f,j)=>`<button class="chip" data-f="${j}" aria-pressed="${j===i}">${f.name}</button>`).join('')}</div>
    <div class="card">
      <p class="muted">${M.functions[i].note||''}</p>
      <label>Optional: the two people's birth dates — adds Tara Bala and Chandra Bala</label>
      <div class="row">
        <input type="date" id="ma"><input type="date" id="mb">
      </div>
      <button class="go" id="mgo">Find auspicious days</button>
      <div id="mout"></div>
    </div>
    <div class="warn">The day is only part of a muhurat. The lagna and the actual hour are chosen with a birth time and place, which this page does not have. Treat it as a shortlist, not a final date — and ask someone who knows your tradition.</div>
  `;
  s.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ s.dataset.fn=b.dataset.f; renderMuhurat(); });
  $('#mgo').onclick = async () => {
    const btn=$('#mgo'); btn.disabled=true; btn.textContent='Checking…';
    const P = await data('panchang.json');
    const persons=[];
    for(const [id,label] of [['ma','First'],['mb','Second']]){
      const v=$('#'+id).value;
      if(v){ const b=await birthStar(v); if(b) persons.push({label,nak:b.nak,rashi:b.rashi}); }
    }
    const fn=M.functions[i], start=today();
    const out=[];
    for(const d of P.days){
      const dd=new Date(d.d+'T00:00:00');
      if(dd<start) continue;
      if((dd-start)/864e5>120) break;
      const b=await birthStar(d.d);
      const v=muhuratDay(M,fn,d,b?b.lon:null,persons);
      if(v.auspicious) out.push(v);
      if(out.length>=20) break;
    }
    $('#mout').innerHTML = out.length ? out.map(v=>`
      <div class="card" style="margin:12px 0 0">
        <h3>${v.day} · ${v.vara}</h3>
        <div class="muted">${v.tithi} · ${v.nakshatra}</div>
        <div style="margin-top:6px">${v.reasons.map(x=>`<div class="muted ok">✓ ${x}</div>`).join('')}</div>
      </div>`).join('')
      : `<p class="muted" style="margin-top:12px">No day in the next 120 days passes every rule for this function${persons.length?' with those birth stars':''}.</p>`;
    btn.disabled=false; btn.textContent='Find auspicious days';
  };
}

/* ------------------------------------------- dasha + kaal sarp (used by chart.js) */
const VIM_LORDS=["Ketu","Venus","Sun","Moon","Mars","Rahu","Jupiter","Saturn","Mercury"];
const VIM_YEARS=[7,20,6,10,7,18,16,19,17];
function vimshottari(moonLon, ageYears){
  const span=360/27;
  const nak=Math.floor(moonLon/span)%27;
  const frac=(moonLon%span)/span;
  const start=nak%9;
  const first=VIM_YEARS[start]*(1-frac);
  let cursor=0, idx=start, len=first, guard=0;
  while(guard++<12){
    if(ageYears < cursor+len) break;
    cursor+=len; idx++; len=VIM_YEARS[idx%9];
  }
  const lord=VIM_LORDS[idx%9], total=VIM_YEARS[idx%9];
  const inMd=ageYears-cursor;
  let c=0, ant=lord;
  for(let k=0;k<9;k++){
    const j=(idx+k)%9, l=total*VIM_YEARS[j]/120;
    if(inMd < c+l){ ant=VIM_LORDS[j]; break; }
    c+=l;
  }
  return {lord, ant, start:VIM_LORDS[start], balance:first};
}

const KS_NAMES=["Anant","Kulik","Vasuki","Shankhpal","Padma","Mahapadma","Takshak",
                "Karkotak","Shankhachud","Ghatak","Vishdhar","Sheshnag"];
function kaalSarp(P){
  const rahu=P.Rahu, ketu=P.Ketu;
  const seven=["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn"];
  const inArc=(lon,a,b)=>((lon-a+360)%360) < ((b-a+360)%360);
  const a=seven.every(g=>inArc(P[g],rahu,ketu));
  const b=seven.every(g=>inArc(P[g],ketu,rahu));
  if(!a && !b) return {present:false};
  return {present:true, side:a?"Rahu to Ketu":"Ketu to Rahu",
          rahuRashi:Math.floor(rahu/30)%12};
}

/* ------------------------------------------------------------------ tabs */
const TABS=[['panchang','Panchang',renderPanchang],['horoscope','Horoscope',renderHoroscope],
  ['muhurat','Muhurat',renderMuhurat],['kundli','Kundli',renderKundli],
  ['match','Kundali match',renderMatch],
  ['numerology','Numerology',renderNumerology],['palmistry','Palmistry',renderPalmistry],
  ['lalkitab','Lal Kitab',renderLalkitab],['shastra','Shastra',renderShastra],
  ['jyotish','Jyotish',renderJyotish],['reading','Reading',renderReading]];
const done={};
function show(id){
  // Never let a stray hash blank the page. A URL like #top, or any anchor from
  // a shared link, would otherwise match no tab and hide every section.
  if(!TABS.some(t=>t[0]===id)) id = 'panchang';
  const _d = document.getElementById('drawer'), _s = document.getElementById('scrim');
  if(_d) _d.classList.remove('open');
  if(_s) _s.classList.remove('on');
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id===id));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===id));
  location.hash = id;
  if(done[id]) return;
  const tab = TABS.find(t=>t[0]===id);
  const box = $('#'+id);
  const label = tab ? tab[1] : id;
  if(!tab || !box) return;
  // Fill an empty panel while the data loads, so the screen never looks blank
  // (and the footer is never mistaken for content).
  if(!box.innerHTML.trim()) box.innerHTML = '<p class="muted">Loading…</p>';
  // Mark the tab done only once it has actually rendered. A blank tab with no
  // explanation is worse than an error message, so say what failed and offer
  // a retry instead of leaving the screen empty forever.
  Promise.resolve()
    .then(()=>tab[2]())
    .then(()=>{ done[id]=1; })
    .catch(err=>{
      const msg = (err && err.message) ? err.message : String(err);
      box.innerHTML = '<div class="card">'
        + '<h2>' + label + '</h2>'
        + '<p>This screen could not load.</p>'
        + '<p class="muted">' + msg + '</p>'
        + '<p class="muted">Everything is served from this site itself, so check your connection and try again.</p>'
        + '</div>'
        + '<button class="go" id="retrybtn">Try again</button>';
      const rb = $('#retrybtn');
      if(rb) rb.onclick = ()=>show(id);
    });
}
const _mb = document.getElementById('menu-btn');
const _drawer = document.getElementById('drawer');
const _scrim = document.getElementById('scrim');
function menu(open){
  if(!_drawer) return;
  _drawer.classList.toggle('open', open);
  _scrim.classList.toggle('on', open);
  if(_mb) _mb.setAttribute('aria-expanded', open ? 'true' : 'false');
}
if(_mb) _mb.onclick = () => menu(!_drawer.classList.contains('open'));
if(_scrim) _scrim.onclick = () => menu(false);
document.addEventListener('keydown', e => { if(e.key === 'Escape') menu(false); });

$('#tabs').innerHTML = TABS.map(([id,label])=>
  `<button data-t="${id}" role="tab" aria-controls="${id}">${label}</button>`).join('');
document.querySelectorAll('#tabs button').forEach((b,i,arr)=>{
  b.onclick=()=>show(b.dataset.t);
});
$('#tabs').addEventListener('keydown', e => {
  const tabs = Array.from(document.querySelectorAll('#tabs button'));
  const i = tabs.indexOf(document.activeElement);
  if(i > -1) {
    if(e.key === 'ArrowRight') {
      e.preventDefault();
      tabs[(i + 1) % tabs.length].focus();
    } else if(e.key === 'ArrowLeft') {
      e.preventDefault();
      tabs[(i - 1 + tabs.length) % tabs.length].focus();
    }
  }
});
show((location.hash||'#panchang').slice(1));
window.addEventListener('hashchange',()=>{
  const id=(location.hash||'#panchang').slice(1);
  if(TABS.some(t=>t[0]===id)) show(id);
});

    const d = new Date(m.generated);
    $('#footer-meta').innerHTML = '<br>Data generated on: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
  }
}).catch(()=>{});
