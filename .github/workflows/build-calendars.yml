name: Build calendars

# Turns docs/data/festivals.json into .ics files people can subscribe to in
# Google Calendar, Apple Calendar or Outlook. Static files, no server, refreshed
# weekly so new festival data lands without anyone lifting a finger.
#
# The second job patches the page head. It lives here because GitHub refuses to
# dispatch newly-added workflow files while this one dispatches fine.
#
# The head patch is a script in tools/, not inline. Inline Python containing HTML
# at column 1 terminates the YAML block scalar, which makes the whole workflow
# unparseable - and GitHub then reports "Workflow does not have
# 'workflow_dispatch' trigger" rather than a YAML error. That mistake cost a lot
# of time; keep the Python in files.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  calendars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the .ics files
        run: python3 tools/build_calendars.py

      - name: Verify calendars
        run: |
          python3 -c "import pathlib; [print(n, len((pathlib.Path('docs/calendar')/n).read_bytes())) for n in ('festivals.ics','festivals-only.ics')]"

      - name: Commit calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar/
          git diff --staged --quiet && echo "no change" || { git commit -m "Refresh festival calendars [skip ci]"; git push; }

  head-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the page head
        run: python3 tools/patch_head.py

      - name: Commit head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "no change" || { git commit -m "Add search and social tags to the head [skip ci]"; git push; }
