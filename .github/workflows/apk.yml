      - name: Build the retrograde and combustion calendar
        run: |
          # Pure function of the ephemeris generated just above - no external source.
          python3 tools/build_retrograde.py --eph docs/data/ephemeris.json \
            --out docs/data/retrograde.json

      - name: Fill festival-calendar gaps from the panchang
        run: |
          # kalagana's festival table has holes - Krishna Janmashtami was absent
          # from 2026 entirely. Each missing entry is derived from the panchang
          # by masa, paksha and tithi, so the date is computed rather than typed.
          python3 tools/patch_festivals.py \
            --festivals docs/data/festivals.json \
            --panchang docs/data/panchang.json

      - name: Build the place gazetteer (GeoNames, CC BY 4.0)
        run: |
          # Village-level coordinates, split by state and name prefix so the
          # browser loads one small file instead of 4 MB. Build-time only:
          # GitHub's runners can reach GeoNames, and the site stays offline.
          python3 tools/build_places.py --out docs/data/places
          du -sh docs/data/places
