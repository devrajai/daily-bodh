name: Build APK

# Builds the debug APK on GitHub's runners and publishes it into docs/download/
# so the GitHub Pages site can serve it. Also attaches it to a release.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'          # the publish step touches docs/ only, so this avoids a loop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK for the website
        run: |
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/DailyBodh-1.0-debug.apk
          ls -la docs/download

      - name: Commit APK to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/DailyBodh-1.0-debug.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest APK to the download page"
            git push
          fi

      - name: Attach APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: "Automatically built debug APK of Daily Bodh."
          files: app/build/outputs/apk/debug/app-debug.apk
