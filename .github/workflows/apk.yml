name: Build APK

# Builds the debug APK on GitHub's runners, generates the full Bhagavad Gita pack
# from the public-domain source, and publishes the APK into docs/download/ so the
# GitHub Pages site can serve it. Also attaches the APK to a release.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'          # the publish step touches docs/ only, so this avoids a loop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship the Android SDK already. Just make sure the
      # packages we need are present and the licences are accepted.
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch the public-domain Gita source data
        run: |
          mkdir -p /tmp/gitasrc
          for f in verse.json translation.json chapters.json; do
            curl -fsSL "https://raw.githubusercontent.com/gita/gita/main/data/$f" -o "/tmp/gitasrc/$f"
          done

      - name: Generate the full Gita pack (18 chapters, 701 shlokas)
        run: python3 tools/build_gita.py --src /tmp/gitasrc --out app/src/main/assets/content/gita.json

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK for the website
        run: |
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/DailyBodh-1.0-debug.apk
          ls -la docs/download

      - name: Publish APK and the generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/DailyBodh-1.0-debug.apk app/src/main/assets/content/gita.json
          if git diff --staged --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Publish APK and generated Gita pack [skip ci]"
            git push
          fi

      - name: Attach APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: "Automatically built debug APK of Daily Bodh, with the complete Bhagavad Gita."
          files: app/build/outputs/apk/debug/app-debug.apk
